spring.application.name=banco-cicd
server.port=${PORT:8080}

# Valores por defecto = entorno local. En la nube se definen como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/udeabank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# Origenes permitidos para CORS (separados por coma). En la nube: variable CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}